# Serenity usa esta sección para iniciar y configurar el navegador de las pruebas.
webdriver {
  # Ejecuta las pruebas en Google Chrome.
  driver = chrome

  timeouts {
    # Espera implícita máxima al buscar un elemento, expresada en milisegundos.
    # Si el elemento aparece antes, Selenium continúa sin esperar los 5 segundos completos.
    implicitlywait = 5000
  }

  capabilities {
    # Identifica el navegador solicitado mediante las capacidades estándar de WebDriver
    browserName = "chrome"
    "goog:chromeOptions" {
      # Argumentos de inicio de Chrome para esta sesión de automatización
      args = [
        "remote-allow-origins=*", # Permite la conexión de ChromeDriver con el navegador
        "incognito",              # Usa una sesión temporal sin el perfil normal de Chrome
        "disable-notifications"   # Evita que notificaciones tapen elementos de la página
      ]

      # Preferencias de Chrome: evitan que el gestor de contraseñas interrumpa las pruebas
      # Solo afectan al navegador iniciado por WebDriver, no a la configuración global de Chrome
      prefs {
        # Desactiva el servicio de guardado de credenciales del navegador
        credentials_enable_service = false
        # Desactiva el administrador de contraseñas
        "profile.password_manager_enabled" = false
        # Desactiva avisos de contraseñas comprometidas durante la automatización
        "profile.password_manager_leak_detection" = false
      }
    }
  }
}

# Mantiene el navegador visible para poder observar la ejecución
headless.mode = false

# Captura una imagen después de cada paso y la adjunta al reporte Serenity
serenity {
  take.screenshots = AFTER_EACH_STEP
}

# Datos configurables de la aplicación de demostración; Config.get los lee desde Serenity
saucedemo {
  url = "https://www.saucedemo.com/"
  # Cuenta pública de prueba de SauceDemo; no reemplazar por credenciales personales
  user = "standard_user"
  password = "secret_sauce"
}
